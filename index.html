function pickSubject(title, current){
  return new Promise(res=>{
    const names = allSubjectNames();
    let done = false;
    const sh = sheet(esc(title), (names.length ? names.map(n=>`<button class="big ghost" data-sn="${esc(n)}" style="${keyName(n)===keyName(current)?'border:2px solid var(--navy)':''}">${esc(n)}</button>`).join('') : '')
      + `<div class="field" style="margin-top:12px"><label>ya da ders adını yaz</label><input id="snIn" value="${esc(names.some(n=>keyName(n)===keyName(current))?'':current||'')}"></div><button class="big" id="snOk">Tamam</button>`, api=>{
      api.el.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{ done=true; api.close(); res(b.dataset.sn); });
      api.el.querySelector('#snOk').onclick=()=>{ const v=api.el.querySelector('#snIn').value.trim(); if(!v) return; done=true; api.close(); res(v); };
    });
    const obs = new MutationObserver(()=>{ if(!document.body.contains(sh.el)){ obs.disconnect(); if(!done) res(null); } });
    obs.observe(document.body,{childList:true});
  });
}
function planUpload(){
  const f = document.createElement('input'); f.type='file'; f.accept='.docx,.xlsx,.xls,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel';
  f.onchange = async ()=>{
    const file = f.files[0]; if(!file) return;
    let plan;
    try{
      const buf = await file.arrayBuffer(); const b = new Uint8Array(buf);
      const isSheet = /\.xlsx?$/i.test(file.name);
      if(b[0]===0xD0 && b[1]===0xCF && !isSheet) throw new Error('olddoc');
      plan = isSheet ? await sheetToPlan(buf, file.name) : await docxToPlan(buf, file.name);
    }catch(e){
      const msg = e.message==='olddoc' ? 'Bu eski .doc biçimi. Word’de açıp “.docx” olarak kaydet, sonra tekrar yükle.'
        : e.message==='notable' || e.message==='noweeks' ? 'Dosyada hafta sütunu olan bir plan tablosu bulunamadı.' : 'Bu dosya okunamadı. Word (.docx) ya da Excel (.xlsx, .xls) yıllık planı seçtiğinden emin ol.';
      sheet('Plan okunamadı', `<p style="color:var(--muted);margin-top:0">${msg}</p><button class="big ghost" onclick="this.closest('.ov').remove()">Tamam</button>`); return;
    }
    // ders adını mevcut derslerle eşleştir
    const names = allSubjectNames();
    const g = keyName(plan.subject);
    const match = names.find(n=>keyName(n)===g) || names.find(n=>g.includes(keyName(n)) || keyName(n).includes(g));
    const subject = await pickSubject(`${plan.weeks.length} haftalık plan bulundu. Hangi ders?`, match || plan.subject);
    if(!subject) return;
    const old = planFor(subject);
    if(old && !(await confirmBox('Plan değiştirilsin mi?', `<b>${esc(subject)}</b> için zaten bir plan var. Yenisiyle değiştirilecek.`, 'Değiştir', false))) return;
    if(old) S.plans = S.plans.filter(x=>x!==old);
    S.plans.push({id:uid(), subject, fileName:file.name, weeks:plan.weeks, added:Date.now()});
    lessonPick.key = null; save(); render();
    const miss = ['unit','konu','cikti','surec'].filter(k=>!plan.found.includes(k)).map(k=>({unit:'Ünite/Tema',konu:'Konu',cikti:'Öğrenme çıktıları',surec:'Süreç bileşenleri'}[k]));
    toast(`${esc(subject)} planı yüklendi · ${plan.weeks.length} hafta${miss.length?` · eksik sütun: ${miss.join(', ')}`:''}`);
    if(!plan.dated) toast('Uyarı: planda hafta tarihleri bulunamadı');
  };
  f.click();
}
function programImport(){
  const f = document.createElement('input'); f.type='file';
  f.onchange = async ()=>{
    const file = f.files[0]; if(!file) return;
    if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){ pdfProgram(file); return; }
    if(/^image\//.test(file.type) || /\.(jpe?g|png|heic)$/i.test(file.name)){
      sheet('Bu bir fotoğraf', `<p style="color:var(--muted);margin-top:0">Seçilen dosya: <b>${esc(file.name)}</b>${file.type?` (${esc(file.type)})`:''}. Uygulama fotoğraf okuyamıyor. Okulun “öğretmen ders programları” PDF'ini ya da Claude'un hazırladığı <b>DersProgrami.json</b> dosyasını seç. İkisi de yoksa programı “Program” sekmesinde saatlere dokunarak da girebilirsin.</p><button class="big ghost" onclick="this.closest('.ov').remove()">Tamam</button>`); return;
    }
    try{
      const j = JSON.parse(await file.text());
      if(j.app !== 'artieksi-program' || !Array.isArray(j.slots)) throw new Error('bad');
      applyProgram(j);
    }catch(e){ toast(`“${esc(file.name)}” bir ders programı dosyası değil. DersProgrami.json dosyasını seç.`); }
  };
  f.click();
}
function programPaste(){
  sheet('Program metnini yapıştır', `<textarea id="ppT" placeholder="Claude'un verdiği program metnini buraya yapıştır" style="min-height:180px"></textarea><button class="big" id="ppOk" style="margin-top:10px">Programı kur</button>`, api=>{
    api.el.querySelector('#ppOk').onclick=()=>{
      try{ const j = JSON.parse(api.el.querySelector('#ppT').value.trim()); if(j.app!=='artieksi-program' || !Array.isArray(j.slots)) throw 0; api.close(); applyProgram(j); }
      catch(e){ toast('Metin okunamadı. Claude’un verdiği metnin tamamını kopyaladığından emin ol.'); }
    };
  });
}
function applyProgram(j){
  let newClasses = 0;
  if(Array.isArray(j.periods) && j.periods.length) S.schedule.periods = j.periods.map(p=>({start:p.start, end:p.end}));
  if(j.codes) S.schedule.codeNames = Object.assign({}, S.schedule.codeNames||{}, j.codes);
  if(j.rename) for(const [from, to] of Object.entries(j.rename)){
    for(const c of S.classes){
      const old = c.subjects.find(k=>keyName(k.name)===keyName(from)); if(!old) continue;
      const dup = c.subjects.find(k=>k!==old && keyName(k.name)===keyName(to));
      if(dup && !S.events.some(e=>e.s===dup.id)) c.subjects = c.subjects.filter(k=>k!==dup);
      old.name = to;
    }
    for(const pl of S.plans) if(keyName(pl.subject)===keyName(from)) pl.subject = to;
  }
  const slots = [];
  for(const x of j.slots){
    let c = S.classes.find(k=>keyName(k.name)===keyName(x.cls));
    if(!c){ c = {id:uid(), name:x.cls, students:[], subjects:[]}; S.classes.push(c); newClasses++; }
    let s = c.subjects.find(k=>keyName(k.name)===keyName(x.sub));
    if(!s){
      const gen = c.subjects.length===1 && c.subjects[0].name==='Genel' && !S.events.some(e=>e.s===c.subjects[0].id) ? c.subjects[0] : null;
      if(gen){ gen.name = x.sub; s = gen; } else { s = {id:uid(), name:x.sub}; c.subjects.push(s); }
    }
    slots.push({day:x.day, p:x.p, c:c.id, s:s.id});
  }
  S.schedule.slots = slots; lessonPick.key = null; S.settings.autoKey = null;
  pruneSubjects();
  autoSelect(); save(); render();
  toast(`Ders programı yüklendi · ${slots.length} ders saati${newClasses?` · ${newClasses} yeni sınıf`:''}`);
}

/* ---------- öğretmen ders programı PDF'i ---------- */
function loadScript(src){
  return new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = ()=>rej(new Error('pdflib')); document.head.appendChild(s); });
}
async function getPdfLib(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await loadScript('pdf.worker.min.js');   // ana iş parçacığında çalışır, ayrı worker gerekmez
  await loadScript('pdf.min.js');
  return window.pdfjsLib;
}
async function pdfPages(buf){
  const lib = await getPdfLib();
  const doc = await lib.getDocument({data: new Uint8Array(buf), isEvalSupported:false}).promise;
  const pages = [];
  for(let i=1; i<=doc.numPages; i++){
    const pg = await doc.getPage(i); const vp = pg.getViewport({scale:1}); const tc = await pg.getTextContent();
    pages.push(tc.items.filter(t=>t.str && t.str.trim()).map(t=>({s:t.str.normalize('NFC').trim(), x:t.transform[4], y:vp.height - t.transform[5], w:t.width})));
  }
  return pages;
}
const DAY_NO = {pazartesi:1, sali:2, carsamba:3, persembe:4, cuma:5, cumartesi:6};
const CODE_RE = /^[A-ZÇĞİÖŞÜ0-9][A-ZÇĞİÖŞÜ0-9.\-\/]{1,14}$/;
const CLASS_RE = /^(\d{1,2})\s*[-\/]\s*([A-ZÇĞİÖŞÜ])(?=\s|$)/;
function teacherOf(items){
  for(const it of items){
    const m = /Ad[ıi]\s*Soyad[ıi]\s*:\s*(.*)$/i.exec(it.s);
    if(m){
      if(m[1].trim()) return m[1].trim();
      const same = items.filter(o=>o!==it && Math.abs(o.y-it.y)<3 && o.x>it.x).sort((a,b)=>a.x-b.x)[0];
      return same ? same.s : '';
    }
  }
  return null;
}
function parseTeacherPage(items){
  const cols = items.filter(t=>/^\(\d{1,2}\)$/.test(t.s)).map(t=>({n:+t.s.slice(1,-1), cx:t.x+t.w/2, y:t.y})).sort((a,b)=>a.n-b.n);
  if(!cols.length) throw new Error('nogrid');
  const headY = cols[0].y;
  const colW = cols.length>1 ? (cols[cols.length-1].cx - cols[0].cx)/(cols.length-1) : 40;
  const colOf = t => { const c = t.x + t.w/2; let best=null, d=1e9; for(const k of cols){ const dd=Math.abs(k.cx-c); if(dd<d){ d=dd; best=k; } } return d <= colW*0.6 ? best : null; };
  const footer = items.filter(t=>/Yukarıdaki dersler|Başlangıç Tarihi|^Ders Adı$/i.test(t.s) && t.y>headY).reduce((m,t)=>Math.min(m,t.y), 1e9);
  const days = items.filter(t=>DAY_NO[asciiLow(t.s)] && t.y>headY && t.y<footer).map(t=>({d:DAY_NO[asciiLow(t.s)], y:t.y})).sort((a,b)=>a.y-b.y);
  if(!days.length) throw new Error('nodays');
  // zil saatleri
  const times = {};
  for(const t of items){ if(/^\d{1,2}[:.]\d{2}$/.test(t.s) && t.y>headY && t.y<days[0].y){ const c = colOf(t); if(c) (times[c.n] = times[c.n]||[]).push(t); } }
  const timeBottom = Math.max(headY, ...items.filter(t=>/^\d{1,2}[:.]\d{2}$/.test(t.s) && t.y<days[0].y).map(t=>t.y));
  const periods = cols.map(c=>{ const ts = (times[c.n]||[]).sort((a,b)=>a.y-b.y); return {start: ts[0]?ts[0].s.replace('.',':'):'', end: ts[1]?ts[1].s.replace('.',':'):''}; });
  // gün satırları
  const bands = days.map((d,i)=>{
    const top = i===0 ? timeBottom+2 : (days[i-1].y + d.y)/2;
    const bot = i===days.length-1 ? Math.min(footer-1, d.y + (i>0 ? (d.y-days[i-1].y)/2 : 20)) : (d.y + days[i+1].y)/2;
    return {d:d.d, top, bot};
  });
  const cells = {};
  for(const t of items){
    if(t.y<=timeBottom || t.y>=footer || DAY_NO[asciiLow(t.s)]) continue;
    const b = bands.find(b=>t.y>b.top && t.y<=b.bot); const c = colOf(t);
    if(!b || !c) continue;
    (cells[b.d+'|'+c.n] = cells[b.d+'|'+c.n] || []).push(t);
  }
  const slots = [];
  for(const [k, arr] of Object.entries(cells)){
    const [day, p] = k.split('|').map(Number);
    const lines = arr.sort((a,b)=>a.y-b.y || a.x-b.x).map(t=>t.s);
    const ci = lines.findIndex(s=>CLASS_RE.test(s)); if(ci < 0) continue;
    const m = CLASS_RE.exec(lines[ci]);
    const code = lines.slice(ci+1).find(s=>CODE_RE.test(s) && !CLASS_RE.test(s));
    if(!code) continue;
    slots.push({day, p, cls:`${m[1]} ${m[2]}`, code});
  }
  slots.sort((a,b)=>a.day-b.day || a.p-b.p);
  // alttaki ders adı tablosu
  const names = {};
  const dersH = items.find(t=>t.s==='Ders' && t.y>footer-1), adH = items.find(t=>/^Ders Adı$/i.test(t.s));
  if(dersH && adH){
    const end = (items.find(t=>/^Toplamlar$/i.test(t.s))||{y:1e9}).y;
    const dayH = items.filter(t=>/^(PZT|SALI|ÇAR\.?|PRŞ|CUMA)$/.test(t.s) && t.y > dersH.y-40 && t.y < dersH.y+5).reduce((m,t)=>Math.min(m,t.x), 1e9);
    const nums = items.filter(t=>/^\d{1,2}$/.test(t.s) && t.x < Math.min(dersH.x, adH.x)-100 && t.y>dersH.y && t.y<end).sort((a,b)=>a.y-b.y);
    nums.forEach((n,i)=>{
      const top = i===0 ? dersH.y+4 : (nums[i-1].y+n.y)/2, bot = i===nums.length-1 ? end-2 : (n.y+nums[i+1].y)/2;
      const band = items.filter(t=>t.y>top && t.y<=bot);
      const code = band.find(t=>t.x>=dersH.x-15 && t.x<=dersH.x+dersH.w+10 && CODE_RE.test(t.s));
      if(!code) return;
      const nm = band.filter(t=>t!==code && t.x>code.x+code.w && t.x<dayH-5).sort((a,b)=>a.y-b.y).map(t=>t.s).join(' ');
      if(nm && !names[code.s]) names[code.s] = nm;
    });
  }
  const sd = items.map(t=>/Başlangıç Tarihi\s*:\s*(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})/i.exec(t.s)).find(Boolean);
  return {periods, slots, names, startDate: sd ? sd[1] : null};
}
function cleanCourseName(n){ return titleCase(String(n||'').replace(/\s+\d{1,2}$/,'').trim()); }

async function pdfProgram(file){
  const wait = sheet('Program okunuyor', `<p style="color:var(--muted);margin:0 0 8px">PDF'teki sayfalar okunuyor, birkaç saniye sürebilir…</p>`);
  let pages;
  try{ pages = await pdfPages(await file.arrayBuffer()); }
  catch(e){ wait.close(); sheet('PDF okunamadı', `<p style="color:var(--muted);margin-top:0">${e.message==='pdflib' ? 'PDF okuyucu yüklenemedi. Uygulamayı internete bağlıyken bir kez açıp tekrar dene.' : 'Bu PDF açılamadı. Dosya şifreli ya da bozuk olabilir.'}</p><button class="big ghost" onclick="this.closest('.ov').remove()">Tamam</button>`); return; }
  wait.close();
  const teachers = pages.map((it,i)=>({name: teacherOf(it), i})).filter(t=>t.name);
  if(!teachers.length){
    sheet('Öğretmen bulunamadı', `<p style="color:var(--muted);margin-top:0">PDF'te “Adı Soyadı” yazan bir öğretmen programı bulunamadı. Taranmış (resim) bir PDF olabilir. Programın fotoğrafını Claude'a gönderirsen metne çevirir.</p><button class="big ghost" onclick="this.closest('.ov').remove()">Tamam</button>`); return;
  }
  const mine = S.settings.teacherName && teachers.find(t=>keyName(t.name)===keyName(S.settings.teacherName));
  if(mine && teachers.length>1) return pdfPreview(pages[mine.i], mine.name, teachers, pages);
  if(teachers.length===1) return pdfPreview(pages[teachers[0].i], teachers[0].name, teachers, pages);
  pickTeacher(teachers, pages);
}
function pickTeacher(teachers, pages){
  const list = q => teachers.filter(t=>!q || trLower(t.name).includes(trLower(q))).sort((a,b)=>cmpTR(a.name,b.name))
    .map(t=>`<button class="li" style="width:100%;text-align:left" data-ti="${t.i}"><span class="t">${esc(titleCase(t.name))}</span></button>`).join('') || '<div style="color:var(--muted)">Eşleşen yok.</div>';
  sheet(`${teachers.length} öğretmen bulundu`, `<input id="tq" placeholder="Adını yaz" autocomplete="off" style="margin-bottom:10px"><div class="card" id="tl">${list('')}</div>`, api=>{
    const bind = ()=> api.el.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{ const t = teachers.find(x=>x.i===+b.dataset.ti); api.close(); pdfPreview(pages[t.i], t.name, teachers, pages); });
    const q = api.el.querySelector('#tq'); q.addEventListener('input', ()=>{ api.el.querySelector('#tl').innerHTML = list(q.value); bind(); }); bind();
    setTimeout(()=>q.focus(), 60);
  });
}
function pdfPreview(items, name, teachers, pages){
  let r;
  try{ r = parseTeacherPage(items); }catch(e){ toast('Bu öğretmenin sayfası okunamadı'); return; }
  if(!r.slots.length){ toast(`${esc(titleCase(name))} için ders bulunamadı`); return; }
  const codes = [...new Set(r.slots.map(s=>s.code))];
  const known = S.schedule.codeNames || {};
  const byDay = {}; r.slots.forEach(s=>{ (byDay[s.day] = byDay[s.day]||[]).push(s); });
  const body = `<div class="card"><div style="font-size:19px;font-weight:800">${esc(titleCase(name))}</div>
      <div style="color:var(--muted)">${r.slots.length} ders saati${r.startDate?` · ${esc(r.startDate)} tarihinden itibaren`:''}</div>
      ${teachers.length>1?`<button class="l-link" id="pvOther" style="margin-top:6px">Başka öğretmen seç</button>`:''}</div>
    <div class="card"><h4>Haftalık program</h4>${Object.keys(byDay).sort().map(d=>`<div class="li"><div class="t" style="white-space:normal"><b>${DAYS[d]}</b><small>${byDay[d].map(s=>`${s.p}. ${esc(s.cls)} ${esc(s.code)}`).join(' · ')}</small></div></div>`).join('')}</div>
    <div class="card"><h4>Ders adları</h4>${codes.map(c=>`<div class="field"><label>${esc(c)}${r.names[c]?` · PDF'te: ${esc(r.names[c])}`:''}</label><input data-code="${esc(c)}" value="${esc(known[c] || cleanCourseName(r.names[c]) || c)}" autocomplete="off"></div>`).join('')}
      <div class="hint">Uygulamada görünecek ad. Yıllık plan bu adla eşleşir.</div></div>
    <button class="big" id="pvOk">Programı kur</button>
    <div class="hint">Öğrenciler, puanlar ve planlar korunur; sadece haftalık program değişir.</div>`;
  sheet('PDF\'ten program', body, api=>{
    const o = api.el.querySelector('#pvOther'); if(o) o.onclick=()=>{ api.close(); pickTeacher(teachers, pages); };
    api.el.querySelector('#pvOk').onclick=()=>{
      const map = {}; api.el.querySelectorAll('[data-code]').forEach(i=>{ map[i.dataset.code] = i.value.trim() || i.dataset.code; });
      // aynı kodun eski adı farklıysa, var olan dersi yeniden adlandır
      const rename = {}; for(const c of codes) if(known[c] && keyName(known[c])!==keyName(map[c])) rename[known[c]] = map[c];
      S.settings.teacherName = name;
      api.close();
      const per = r.periods.slice(); while(per.length && !per[per.length-1].start && !per[per.length-1].end) per.pop();
      applyProgram({periods: per, slots: r.slots.map(s=>({day:s.day, p:s.p, cls:s.cls, sub:map[s.code]})), codes: map, rename});
    };
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  switch(a){
    case 'plus': score(id, 1); break;
    case 'minus': score(id, -1); break;
    case 'student': studentSheet(id); break;
    case 'cls': if(S.settings.classId===id && curClass()?.id===id) manage('classes'); else { S.settings.classId=id; searchQ=''; save(); render(); } break;
    case 'sub': { const c=curClass(); S.settings.subjectByClass[c.id]=id; save(); render(); break; }
    case 'crit': S.settings.criterionId=id; save(); render(); break;
    case 'addClass': addClass(); break;
    case 'addSub': addSubject(); break;
    case 'addCrit': addCriterion(); break;
    case 'manage': manage(b.dataset.what); break;
    case 'theme': S.settings.theme = {auto:'light', light:'dark', dark:'auto'}[S.settings.theme]; save(); render(); break;
    case 'names': S.settings.showNames = !S.settings.showNames; save(); render(); toast(S.settings.showNames?'İsimler gösteriliyor':'İsimler gizlendi, sadece numaralar görünüyor'); break;
    case 'sort': S.settings.sort = {no:'name', name:'score', score:'no'}[S.settings.sort]; save(); render(); break;
    case 'search': searchOpen = !searchOpen; if(!searchOpen) searchQ=''; renderTop(); renderList(); if(searchOpen) setTimeout(()=>$('#q')&&$('#q').focus(),30); break;
    case 'import': importSheet(curClass()?.id); break;
    case 'addStudent': addStudent(); break;
    case 'random': randomPick(); break;
    case 'report': reportSheet(); break;
    case 'backup': backupSheet(); break;
    case 'demo': demo(); break;
    case 'plan': planSheet(); break;
    case 'lessonHour': lessonPick.idx = +b.dataset.i; renderLesson(); break;
    case 'lessonCopy': copyText(lessonCopyText, b); break;
    case 'lessonSkip': toggleSkip(); break;
    case 'lessonOpen': planSheet('week'); break;
    case 'planUpload': planUpload(); break;
  }
});
autoSelect(); render();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ if(autoSelect()) render(); else renderLesson(); } });
setInterval(()=>{ if(document.visibilityState==='visible' && !document.querySelector('.ov')){ if(autoSelect()) render(); } }, 60000);

if('serviceWorker' in navigator && location.protocol === 'https:'){
  // İnternet yokken güncelleme kontrolü yapma; zaten kurulu olan çevrimdışı kopya çalışır.
  const reg = ()=>{ if(navigator.onLine) navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r=>r.update && r.update()).catch(()=>{}); };
  window.addEventListener('load', reg);
  window.addEventListener('online', reg);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') reg(); });
  // Yeni sürüm devreye girince bir kez yenile (açık pencere yokken)
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloaded || document.querySelector('.ov')) return; reloaded = true; location.reload();
  });
}
